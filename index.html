<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TotiChat Games2</title>
<style>
:root{font-family:system-ui,Tahoma,sans-serif;color:#fff;background:#0b1023}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#322455,#0b1023 65%);min-height:100vh}header{text-align:center;padding:28px 12px}h1{color:#f8d889;margin:0}p{color:#bdc6dd}.wrap{max-width:900px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.tabs button{width:auto;padding:12px}.panel{border:1px solid #a98a4b;border-radius:20px;padding:20px;text-align:center;background:#171b34;min-height:340px;margin-top:18px}button{border:1px solid #dfbd66;border-radius:12px;background:linear-gradient(135deg,#8e6828,#e6c978);color:#17101b;font-weight:800;padding:14px 25px;cursor:pointer;font-size:16px}button:disabled{opacity:.5}#output{font-size:24px;min-height:45px;margin:18px}#wheel{height:230px;width:230px;border-radius:50%;border:8px solid #d4ad50;margin:15px auto;display:grid;place-items:center;font-size:40px;background:conic-gradient(#a9385b 0 45deg,#ddac47 45deg 90deg,#3862ad 90deg 135deg,#33a68d 135deg 180deg,#a9385b 180deg 225deg,#ddac47 225deg 270deg,#3862ad 270deg 315deg,#33a68d 315deg 360deg);transition:transform 2s cubic-bezier(.12,.72,.13,1)}.slots{font-size:48px;letter-spacing:8px;padding:24px;border:1px solid #80683c;border-radius:16px;display:inline-block}.cards{display:flex;gap:10px;justify-content:center}.card{padding:24px;background:#fff;color:#222;border-radius:12px;font-size:36px}.gems{display:grid;grid-template-columns:repeat(3,70px);gap:10px;justify-content:center}.gem{font-size:32px;padding:14px 0;background:#29375e;border-radius:10px}small{color:#aab5d0}footer{text-align:center;padding:24px}
</style></head><body><header><h1>👑 TotiChat Games2</h1><p>مختبر ألعاب مستقل — أرصدة افتراضية فقط</p></header><main class="wrap"><div class="tabs" id="tabs"></div><section class="panel"><h2 id="title"></h2><div id="game"></div><div id="output" aria-live="polite"></div><button id="play">العب</button><p><small>هذه نسخة أولية للتجربة فقط، بدون محفظة أو رهانات مالية.</small></p></section></main><footer>© TotiChat Games — Prototype</footer>
<script>
const games=[['wheel','🎡 العجلة الملكية'],['dice','🎲 النرد'],['slots','🎰 777'],['cards','🃏 البطاقات'],['gems','💎 صندوق الجواهر']];
let current='wheel',rotation=0,locked=false;const game=document.getElementById('game'),out=document.getElementById('output'),play=document.getElementById('play');
function rand(n){return Math.floor(Math.random()*n)}
function render(){out.textContent='';locked=false;play.disabled=false;document.getElementById('title').textContent=games.find(x=>x[0]===current)[1];document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===current));
if(current==='wheel'){game.innerHTML='<div id="wheel">⭐</div>';play.textContent='دوّر العجلة'}
if(current==='dice'){game.innerHTML='<div style="font-size:100px">🎲</div>';play.textContent='ارمِ النرد'}
if(current==='slots'){game.innerHTML='<div class="slots" id="slots">🍒 7️⃣ 💎</div>';play.textContent='تدوير'}
if(current==='cards'){game.innerHTML='<div class="cards"><div class="card" id="c1">?</div><div class="card" id="c2">?</div></div>';play.textContent='اسحب بطاقتين'}
if(current==='gems'){game.innerHTML='<div class="gems" id="gems">'+Array.from({length:9},()=>'<div class="gem">❔</div>').join('')+'</div>';play.textContent='افتح الصندوق'}}
function action(){if(locked)return;if(current==='wheel'){locked=true;play.disabled=true;let i=rand(8);rotation+=1440+i*45+22;document.getElementById('wheel').style.transform='rotate('+rotation+'deg)';setTimeout(()=>{out.textContent='نتيجة تجريبية: '+['💎','⭐','👑','🎁','💎','⭐','👑','🎁'][i];locked=false;play.disabled=false},2050)}
if(current==='dice'){let n=rand(6)+1;out.textContent='نتيجة النرد: '+n}
if(current==='slots'){let s=['🍒','7️⃣','💎','⭐','👑'];let a=Array.from({length:3},()=>s[rand(s.length)]);document.getElementById('slots').textContent=a.join(' ');out.textContent=a.every(x=>x===a[0])?'تطابق الثلاثة!':'جرّب مرة أخرى'}
if(current==='cards'){let a=rand(13)+1,b=rand(13)+1;document.getElementById('c1').textContent=a;document.getElementById('c2').textContent=b;out.textContent=a===b?'تعادل':a>b?'البطاقة الأولى أعلى':'البطاقة الثانية أعلى'}
if(current==='gems'){let x=['💎','👑','⭐','🎁','💠'];let a=[...document.querySelectorAll('.gem')];a.forEach(el=>el.textContent=x[rand(x.length)]);out.textContent='تم فتح الصندوق'}}
games.forEach(([id,name])=>{let b=document.createElement('button');b.textContent=name;b.dataset.id=id;b.onclick=()=>{current=id;render()};document.getElementById('tabs').appendChild(b)});play.onclick=action;render();
</script></body></html>
